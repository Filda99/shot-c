name: Stav sbírky z Donia

on:
  schedule:
    - cron: '17 */3 * * *'   # každé 3 hodiny
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/donio.js
      - name: Commit, pokud se stav změnil
        run: |
          if git diff --quiet -- novy-web/data/donio.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add novy-web/data/donio.json
          git commit -m "Donio: aktualizace stavu sbírky"
          git push
