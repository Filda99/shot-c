# Dočasné: zjistit, co Donio vrací runneru GitHubu. Smazat spolu s větví.
name: Donio diagnostika
on:
  push:
    branches: [claude/donio-diagnostika]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stáhnout stránku sbírky
        run: |
          curl -sSL -A 'Mozilla/5.0 (compatible; shot-c.cz stav sbirky)' -H 'Accept-Language: cs' \
            -o page.html -w 'HTTP %{http_code}, %{size_download} B\n' \
            'https://donio.cz/shot-c-autorske-a-cappella-album'
          python3 - <<'PY'
          import re
          s = open('page.html', encoding='utf-8').read().replace('\\"', '"')
          def ctx(pat, n=3, w=300):
              print('=== ' + pat)
              for m in list(re.finditer(pat, s))[:n]:
                  print('...' + s[max(0, m.start()-w):m.end()+w].replace('\n', ' ') + '...\n')
          ctx(r'"collectedLabel"', 2, 500)
          ctx(r'InCents"', 6, 150)
          ctx(r'"endsAt"', 3, 150)
          print('=== Kč částky:', sorted(set(re.findall(r'[0-9][0-9  .]{2,12}(?:&nbsp;| | )Kč', s)))[:20])
          PY
