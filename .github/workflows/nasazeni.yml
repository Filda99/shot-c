# Nasazení webu na GitHub Pages s čerstvými daty (koncerty z kalendáře).
#
# Běží po každém merge do main, každou hodinu a ručně (Run workflow).
# Data se stáhnou JEN do nasazované kopie webu, do repozitáře se nic
# necommituje, pravidlo „do main jen přes PR“ zůstává.
# Další zdroje dat (Donio) jsou další kroky před „Připravit web“.
#
# Předpoklad: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Nasazení webu

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Testy
        run: |
          node tests/events.test.js
          node tests/sync-calendar.test.js
          node tests/youtube.test.js

      # Když kalendář nejde stáhnout, web se nasadí s koncerty z repozitáře.
      - name: Koncerty z kalendáře
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: |
          if ! node scripts/sync-calendar.js; then
            echo "::warning::Kalendář se nepodařilo načíst, nasazuji koncerty z repozitáře."
            git checkout -- data/events.json
          fi
          git diff --stat -- data/events.json || true

      # Skript přidává PR „Tahat stav sbírky z Donio“; do té doby se krok přeskočí.
      - name: Stav sbírky z Donia
        continue-on-error: true
        run: if [ -f scripts/donio.js ]; then node scripts/donio.js; fi

      # Poslední 3 videa z YouTube (RSS kanálu). Když selže, zůstanou dlaždice s odkazem na kanál.
      - name: Videa z YouTube
        continue-on-error: true
        run: node scripts/youtube.js || git checkout -- data/videos.json

      - name: Připravit web
        run: |
          mkdir _site
          for f in $(ls -A); do
            case "$f" in .git|.github|_site|scripts|tests|docs|README.md|.gitignore) ;; *) cp -r "$f" _site/ ;; esac
          done
          # ?v=dev → ?v=<commit>, aby prohlížeče po nasazení nebraly staré CSS/JS z cache
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
          ls -A _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Nasazení je samostatný job (stejně jako v oficiální šabloně GitHubu).
  # deploy-pages se hned po nahrání ptá API na artefakt a API ho občas ještě
  # „nevidí“ („No artifacts named github-pages were found“). Mezi joby je
  # prodleva navíc a při chybě se to po chvíli zkusí znovu.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Počkat a zkusit znovu
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
