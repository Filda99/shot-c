name: donio-probe (dočasné)
on:
  push:
    branches: [claude/project-thread-6p6dxe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: page
        run: |
          curl -sSL --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -H "Accept-Language: cs" -w "code=%{http_code} total=%{time_total}\n" https://donio.cz/podporme-malou-skladatelku-zoiku -o p.html || echo "FAIL $?"
          wc -c p.html || true
          python3 - <<'PY'
          import re
          s = open('p.html', encoding='utf-8', errors='replace').read()
          seen = 0
          for kw in ['Vybráno', 'Vybr\\u00e1no', 'Končí', 'zbývá', 'targetAmount', 'collectedAmount', 'Amount', 'goal', 'endDate', 'endsAt', 'deadline', 'og:title', 'ld+json']:
              for m in list(re.finditer(re.escape(kw), s))[:4]:
                  print('==', kw, '@', m.start(), '::', s[max(0, m.start()-200):m.start()+250].replace('\n', ' '))
          PY
