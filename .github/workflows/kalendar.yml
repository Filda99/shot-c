# Každou hodinu stáhne kalendář koncertů a aktualizuje data/events.json
# (starý web) i novy-web/data/events.json. Když se nic nezměnilo, nic necommituje.
# Adresa kalendáře je v secretu CALENDAR_ICS_URL (Settings → Secrets and variables → Actions).
name: Koncerty z kalendáře

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kalendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Testy
        run: |
          node tests/events.test.js
          node tests/sync-calendar.test.js

      - name: Stáhnout kalendář
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: node scripts/sync-calendar.js

      - name: Uložit změny
        id: commit
        run: |
          if git diff --quiet -- data/events.json novy-web/data/events.json; then
            echo "Žádná změna v koncertech."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json novy-web/data/events.json
          git commit -m "Koncerty: aktualizace z kalendáře"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Push přes GITHUB_TOKEN nemusí sám spustit nasazení GitHub Pages, proto ho vyžádáme.
      - name: Přenasadit web
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Nasazení si GitHub spustí sám."
