<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka nenalezena | Shot-C</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e1e1e4">
  <!-- GitHub Pages vrací 404.html pro jakoukoli chybějící adresu, proto cesty od kořene domény. -->
  <link rel="icon" href="/assets/img/cropped-SHOT-C-color1-32x32.png" sizes="32x32">
  <link rel="icon" href="/assets/img/cropped-SHOT-C-color1-192x192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/img/cropped-SHOT-C-color1-180x180.png">
  <script>
    // Staré adresy: /novy-web/… (náhled nového webu) → stejná cesta od kořene,
    // /koncerty/… a /events/… (starý web a WordPress) → sekce Koncerty.
    (function () {
      var p = location.pathname, h = location.hash;
      var to = null;
      if (/^\/novy-web(\/|$)/.test(p)) to = p.replace(/^\/novy-web\/?/, '/') + location.search + h;
      else if (/^\/(koncerty|events|akce)(\/|$)/.test(p)) to = '/#koncerty';
      if (to) location.replace(to);
    })();
  </script>
  <style>
    :root { --ink: #1d1d1f; --bg: #fafaf7; --yellow: #ffb000; --red: #ec001d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--ink); text-align: center;
      font-family: "Raleway", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bar { position: fixed; inset: 0 0 auto 0; height: 6px; background: linear-gradient(90deg, var(--yellow), var(--red)); }
    h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 600; margin: 0 0 12px; }
    p { margin: 0 0 28px; font-size: 18px; line-height: 1.5; }
    a.btn { display: inline-block; padding: 14px 28px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600;
      background: linear-gradient(90deg, var(--yellow), var(--red)); }
    a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="bar" aria-hidden="true"></div>
  <main>
    <h1>Tahle stránka tu není</h1>
    <p>Web Shot-C má novou podobu a některé staré adresy už neexistují.</p>
    <a class="btn" href="/">Na úvodní stránku</a>
  </main>
</body>
</html>
